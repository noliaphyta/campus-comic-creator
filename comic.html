<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comic Creator — Campus Comic Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/meta/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/meta/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/meta/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/meta/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/meta/apple-touch-icon.png">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Comic Creator — Campus Comic Creator">
  <meta property="og:description" content="Build a comic panel-by-panel from campus photos.">
  <meta property="og:url" content="https://noliaphyta.github.io/campus-comic-creator/comic.html">
  <meta property="og:image" content="https://noliaphyta.github.io/campus-comic-creator/assets/meta/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Comic Creator — Campus Comic Creator">
  <meta name="twitter:image" content="https://noliaphyta.github.io/campus-comic-creator/assets/meta/og-image.png">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/comic.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Comic Creator</h1>
        <p class="tagline">Turns the path you plotted on the map into a comic/visual-novel strip.</p>
      </div>
      <button id="dark-mode-toggle" type="button" title="Toggle dark mode">🌙</button>
    </div>
    <a id="back-to-map" href="index.html">&larr; Back to the map</a>
  </header>

  <main id="comic-main">
    <div id="no-path-message" hidden>
      No path found. Go back to the map, click 2 or more building pins to
      build a path, then hit <strong>Generate Comic</strong>.
    </div>

    <section id="comic-setup">
      <fieldset id="mode-fieldset">
        <legend>How do you want to build it?</legend>
        <label>
          <input type="radio" name="comic-mode" value="auto" checked>
          Autogenerate (pick a look, we do the rest)
        </label>
        <label id="manual-mode-label">
          <input type="radio" name="comic-mode" value="manual">
          Manually select styles &amp; story
        </label>
      </fieldset>

      <div id="autogen-options">
        <label for="aspect-ratio">Panel aspect ratio
          <select id="aspect-ratio">
            <option value="16:9">Widescreen (16:9)</option>
            <option value="4:3" selected>Classic panel (4:3)</option>
            <option value="1:1">Square (1:1)</option>
            <option value="9:16">Portrait / phone (9:16)</option>
          </select>
        </label>
        <label for="filter-style">Visual filter
          <select id="filter-style">
            <option value="halftone" selected>Halftone (ink dots)</option>
            <option value="dither">Ordered Dither</option>
            <option value="duotone">Duotone</option>
            <option value="none">None (cropped only)</option>
          </select>
        </label>
      </div>

      <div id="manual-options" hidden>
        <label for="aspect-ratio-manual">Panel aspect ratio (applies to every panel)
          <select id="aspect-ratio-manual">
            <option value="16:9">Widescreen (16:9)</option>
            <option value="4:3" selected>Classic panel (4:3)</option>
            <option value="1:1">Square (1:1)</option>
            <option value="9:16">Portrait / phone (9:16)</option>
          </select>
        </label>
        <div id="manual-panel-editors"></div>
      </div>

      <button id="build-comic-btn" type="button">Build Comic</button>
      <p id="generate-status" role="status"></p>
    </section>

    <section id="comic-panels"></section>

    <section id="save-share-bar" hidden>
      <button id="download-originals-btn" type="button">Download original photos (.zip)</button>
      <button id="download-finished-btn" type="button">Download finished comic (.zip)</button>
      <button id="copy-link-btn" type="button">Copy shareable link</button>
      <button id="open-finished-btn" type="button">Open finished comic</button>
      <p id="save-share-status" role="status"></p>
    </section>
  </main>

  <details id="credits-panel"></details>

  <script src="https://unpkg.com/inkjs@2/dist/ink.js"></script>
  <script src="https://unpkg.com/glfx-es6/dist/glfx-es6.min.js"></script>
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/stylize.js"></script>
  <script src="js/comic.js"></script>
</body>
</html>
