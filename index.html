<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Comic Creator</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/meta/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/meta/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/meta/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/meta/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/meta/apple-touch-icon.png">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Campus Comic Creator">
  <meta property="og:description" content="Turn campus photos into a walkable comic of William & Mary.">
  <meta property="og:url" content="https://noliaphyta.github.io/campus-comic-creator/">
  <meta property="og:image" content="https://noliaphyta.github.io/campus-comic-creator/assets/meta/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Campus Comic Creator">
  <meta name="twitter:description" content="Turn campus photos into a walkable comic of William & Mary.">
  <meta name="twitter:image" content="https://noliaphyta.github.io/campus-comic-creator/assets/meta/og-image.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Campus Comic Creator</h1>
        <p class="tagline">Plot a walk across campus history. Click 2+ pins to build a path.</p>
      </div>
      <button id="dark-mode-toggle" type="button" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <div id="map-layer-controls">
      <label><input type="checkbox" id="toggle-buildings" checked> Buildings</label>
      <label><input type="checkbox" id="toggle-paths" checked> Footpaths</label>
    </div>
    <div id="route-profile-controls">
      <label for="route-profile">Path type
        <select id="route-profile">
          <option value="foot" selected>Walking paths</option>
          <option value="bike">Cycling paths</option>
          <option value="driving">Roads</option>
        </select>
      </label>
      <span id="route-status" role="status"></span>
    </div>
    <div id="path-controls"></div>
    <div id="filmstrip" hidden></div>
    <div id="timeline-controls"></div>
  </main>

  <details id="credits-panel" hidden></details>

  <footer>
    <a id="contribute-link" href="https://commons.wikimedia.org/wiki/Special:UploadWizard" target="_blank" rel="noopener">
      Contribute a photo to Wikimedia Commons
    </a>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/inkjs@2/dist/ink.js"></script>
  <script src="https://unpkg.com/glfx-es6/dist/glfx-es6.min.js"></script>
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/stylize.js"></script>
  <script src="js/story.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
